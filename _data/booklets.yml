- id: 1997-bulsajo
  year: "1997"
  short: "불사조 대제전"
  title: "'97 불사조 대제전"
  desc: "1997년 9월 24~26일 경북대학교 전자전기공학부 학생회가 연 불사조 대제전 책자의 표지. 하늘소 9기 박준호의 HTML 브라우저가 이 행사 작품전에 나갔다. 사진은 표지만 남아 있다."
  width: 1000
  height: 1421
  pages:
    - { file: 01.jpg, label: "표지" }
