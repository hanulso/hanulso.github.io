<!DOCTYPE html>
<!-- 스타일·모션은 여기 세 값으로 고른다. 슬라이드 내용은 안 건드린다.
     theme:      midnight (어두운 방·기본) | paper (밝은 회의실) | mono (다이어그램이 주인공)
     transition: fade (기본) | rise (아래에서 올라옴) | push (옆에서 밀림) | none
     reveal:     none (기본) | stagger (슬라이드 안 요소가 차례로 올라옴)
     ⚠️ 발표자 창은 별도 문서라 이 토큰이 닿지 않는다. 거기 색은 따로 박혀 있다. -->
<html lang="ko" data-theme="midnight" data-transition="fade" data-reveal="none">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10월 첫째 주 AI 소식</title>
<style>
  /* ── 색 토큰 ─────────────────────────────────────────────────────
     색을 값이 아니라 **이름**으로 쓴다. 테마는 이 이름들만 다시 정의하면 되고,
     규칙 하나하나를 덮어쓸 필요가 없다.
       --fg     본문 글자      --fg-2   보조 글자     --muted  흐린 글자
       --bg     바탕          --panel  카드/코드 바탕  --line   테두리
       --accent 강조(한 가지)  --on-accent 강조 위 글자
     ⚠️ 새 규칙을 쓸 때 #hex 를 직접 넣지 말 것. 넣는 순간 그 규칙만 테마를 안 따른다. */
  :root, html[data-theme="midnight"] {
    --bg:#13234a; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
    --fg:#eef2fa; --fg-2:#cfd7e6; --muted:#b2bdd3; --dim:#97a3bd;
    --accent:#F5B82E; --on-accent:#13234a; --navy:#1a2b4a;
    /* 내용을 뜻하는 색. 성공/참고/실패는 테마마다 따로 잡는다 —
       어두운 판의 파스텔을 흰 종이에 그대로 쓰면 흐려서 안 읽힌다.
       --accent-soft 는 강조 배경용(글자는 --fg 그대로 얹을 수 있는 농도). */
    --ok:#81c784; --info:#4FC3F7; --bad:#e57373; --accent-soft:rgba(255,179,0,.22);
    --nav-bg:rgba(255,255,255,.08); --nav-bg-hover:rgba(255,255,255,.18);
    --grip:rgba(255,255,255,.22); --notes-bg:rgba(10,20,44,.97);
    --shadow:rgba(0,0,0,.5); --plate:#fff;
  }
  /* 밝은 인쇄물 느낌. 빔프로젝터가 어두운 방을 못 만들 때 쓴다. */
  html[data-theme="paper"] {
    --bg:#f7f7f4; --panel:rgba(0,0,0,.04); --line:rgba(0,0,0,.14);
    --fg:#16181d; --fg-2:#3b414d; --muted:#5b6270; --dim:#6b7280;
    --accent:#b26b00; --on-accent:#fff; --navy:#1a2b4a;
    --ok:#2e7d32; --info:#0277bd; --bad:#c62828; --accent-soft:rgba(178,107,0,.16);
    --nav-bg:rgba(0,0,0,.07); --nav-bg-hover:rgba(0,0,0,.16);
    --grip:rgba(0,0,0,.22); --notes-bg:rgba(248,248,245,.97);
    --shadow:rgba(0,0,0,.18); --plate:#fff;
  }
  /* 색을 하나도 안 쓰는 판. 다이어그램·스크린샷이 주인공일 때 화면이 조용해진다. */
  html[data-theme="mono"] {
    --bg:#0a0a0a; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.16);
    --fg:#f2f2f2; --fg-2:#cfcfcf; --muted:#a3a3a3; --dim:#7a7a7a;
    --accent:#ffffff; --on-accent:#0a0a0a; --navy:#0a0a0a;
    --ok:#e8e8e8; --info:#c9c9c9; --bad:#ffffff; --accent-soft:rgba(255,255,255,.20);
    --nav-bg:rgba(255,255,255,.1); --nav-bg-hover:rgba(255,255,255,.2);
    --grip:rgba(255,255,255,.28); --notes-bg:rgba(14,14,14,.97);
    --shadow:rgba(0,0,0,.6); --plate:#fafafa;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; }
  :root { --notesH: 0px; --notesHOpen: 38vh;
          --deckW: 1600px; --deckH: 900px;   /* 고정 캔버스 16:9 */ }
  /* 조절값은 --notesHOpen 에 담고, 열렸을 때만 --notesH 로 흘려보낸다.
     --notesH 를 직접 인라인으로 쓰면 노트를 닫아도 무대가 안 돌아온다 */
  body.notes-open { --notesH: var(--notesHOpen); }
  /* 무대가 줄면 내용이 하단 힌트·쪽번호와 겹친다. 열렸을 때만 여유를 준다.
     .slide 이 position:absolute; inset:0 이라 padding 은 무시된다 — 높이를 직접 줄인다 */
  body.notes-open { --stagePad: 34px; }
  /* 슬라이드 내용은 vh 로 짜여 있어 무대가 줄어도 안 줄어든다.
     줄어든 비율만큼 배율을 낮춰야 잘리지 않는다 (비율은 JS 가 잰다) */
  /* ── 고정 비율 무대 (16:9) ────────────────────────────────────────────
     슬라이드를 1600×900 고정 캔버스에 그리고 **통째로 scale** 한다.
     이러면 창을 줄이거나 비율이 달라져도 **요소 위치가 하나도 안 움직인다.**
     (vh 로 짜면 세로만 줄었을 때 표·이미지가 서로 다르게 반응해 배치가 흐트러진다)
     노트 서랍이 열리면 무대 높이가 줄고, scale 이 그만큼 작아진다. */
  /* ⚠️ .slide 은 원래 규칙에서 position:absolute; inset:0 이다.
     그래서 #stage 에 grid/flex 중앙정렬을 걸어도 **먹지 않는다** (흐름 밖이라).
     좌상단에 붙은 채 scale 되면 슬라이드가 오른쪽 아래로 밀린다.
     → 무대 중앙에 캔버스 중심을 맞춘 뒤(left/top 50% + 음수 마진) 거기서 scale 한다. */
  /* #stage 를 앞에 붙여 우선순위를 올린다 — 뒤에 오는 .slide{inset:0} 에 지지 않게. */
  #stage .slide { width:var(--deckW); height:var(--deckH);
           left:50%; top:50%; right:auto; bottom:auto;
           margin-left:calc(var(--deckW) / -2); margin-top:calc(var(--deckH) / -2);
           transform-origin:50% 50%;
           transform:scale(var(--slideScale, 1));
           /* 슬라이드 안에서 cqh/cqw 를 쓰기 위한 컨테이너 선언.
              고정 캔버스라 1cqh = 9px, 1cqw = 16px 로 **항상 같다.**
              vh 를 그대로 두면 창 비율에 따라 요소마다 다르게 줄어 배치가 흐트러진다. */
           container-type: size; }
  .slide.htmlslide, .slide.diagramslide { display:flex; }
  /* 표 — 기본은 슬라이드 폭을 채운다(일정표용).
     ⚠️ 2열 비교표를 단독으로 쓰면 왼쪽에 붙고 오른쪽이 텅 빈다.
     그때는 .fit 을 같이 준다 — 내용만큼 줄이고 가운데로. */
  .schd{ width:100%; border-collapse:collapse; margin-top:.4rem; }
  .schd td{ padding:.85rem .95rem; border-bottom:1px solid var(--line);
            font-size:1.5rem; color:var(--fg-2); text-align:left; vertical-align:middle; }
  .schd td b{ color:var(--fg); }
  .schd.fit{ width:auto; max-width:100%; margin-left:auto; margin-right:auto; }
  /* 노트가 열리면 무대를 줄인다 — 덮으면 하단 내용이 안 보인다 */
  #stage { position:fixed; left:0; right:0; top:0; bottom:calc(var(--notesH) + var(--stagePad, 0px));
           display:flex; align-items:center; justify-content:center; transition:bottom .3s ease; }
  .slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
           opacity:0; transition:opacity .35s ease; pointer-events:none; }
  .slide.active { opacity:1; pointer-events:auto; }
  .missing { color:var(--muted); font-size:1.4rem; text-align:center; padding:2rem; border:2px dashed var(--line); border-radius:12px; }
  /* diagram slides: styled HTML header + diagram PNG below (titles live HERE, not inside the diagram) */
  .diagramslide { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4.5cqh 5cqw 3cqh; position:relative; }
  .diagramslide h2.slidehead { font-size:2.6rem; font-weight:800; letter-spacing:-.5px; color:var(--fg); text-align:center; margin-bottom:.5rem; line-height:1.1; }
  .diagramslide h2.slidehead .accent { color:var(--accent); }
  .diagramslide .slidesubhead { color:var(--muted); font-size:1.6rem; text-align:center; max-width:90ch; margin-bottom:2.4cqh; line-height:1.4; }
  /* ⚠️ width 를 반드시 준다. max-width/max-height 는 **상한**일 뿐이어서, width 가 없으면
     SVG 는 자기 viewBox 크기로만 렌더된다 — 914x359 도해가 캔버스 폭 1504px 중 914px 만
     쓰고 아래에 캔버스 높이의 43% 가 빈 채로 남았다 (실측 2026-08-22). */
  .diagramslide img.diagram { width:94%; max-width:94%; max-height:74cqh; object-fit:contain; display:block; background:var(--plate); border-radius:10px; box-shadow:0 12px 40px var(--shadow); }
  /* svg_helpers.save() 는 SVG 에 자체 배경(BG)을 칠해서 내보낸다. 그 위에 흰 --plate 를
     깔면 판이 그림보다 조금 넓어 좌우에 흰 세로줄이 드러난다(실측). 판이 필요한 건
     배경 없는 스크린샷/PNG 쪽이라 .svg 에만 배경을 걷는다. */
  .diagramslide img.diagram[src$=".svg"] { background:transparent }
  /* ── 미디어 슬롯 ───────────────────────────────────────────────────
     한 슬라이드에 미디어는 **한 칸**이고, 종류만 넷이다. 자리는 셋 다 같다.
       img   도해(SVG/PNG) — 흰 판을 깔아 선이 배경에 묻히지 않게 한다
       photo 사진·스크린샷  — 판을 깔지 않는다. 사진 위 흰 테두리는 군더더기다
       video 영상          — 들어오면 재생, 나가면 정지 (아래 activateMedia)
       embed HTML 애니메이션 — 순서를 보여줘야 할 때. 재방문마다 다시 돈다
     배경(bg)은 이것들과 **직교**한다. 어느 슬라이드에나 같이 붙는다. */
  /* 출처 링크. 발표 중 눌러도 덱을 잃지 않게 target=_blank 로 연다.
     인쇄에서는 색을 죽이고 밑줄만 남긴다. */
  .slide a.src { color:var(--accent); text-decoration:underline; text-underline-offset:3px;
                 text-decoration-thickness:1px; opacity:.9; }
  .slide a.src:hover { opacity:1; text-decoration-thickness:2px; }
  @media print { .slide a.src { color:inherit; opacity:.7 } }
  .diagramslide img.photo { max-width:94%; max-height:74cqh; object-fit:contain; display:block;
                            border-radius:10px; box-shadow:0 12px 40px var(--shadow); }
  .diagramslide video.media { max-width:94%; max-height:74cqh; display:block;
                              border-radius:10px; box-shadow:0 12px 40px var(--shadow); background:#000; }
  .diagramslide .embed { width:94%; max-height:74cqh; overflow:hidden; display:flex;
                         align-items:center; justify-content:center; }
  .mediacap { color:var(--dim); font-size:1.2rem; margin-top:.7rem; text-align:center; }

  /* 배경 이미지 — 글자가 읽혀야 하므로 **가림막(scrim)** 을 반드시 함께 깐다.
     가림막 색은 --bg 토큰이라 paper 테마에서는 자동으로 흰 가림막이 된다.
     진하기는 슬라이드마다 bgDim 으로 조절한다 (0=원본, 1=배경 안 보임). */
  .slide.hasbg { background-size:cover; background-position:center; }
  .slide.hasbg::before { content:''; position:absolute; inset:0;
                         background:var(--bg); opacity:var(--bgDim, .58); }
  .slide.hasbg > * { position:relative; z-index:1; }

  /* 그림을 글 **옆에** 세우는 배치.
     글 위에 가로로 눕히면 그림이 25cqh 로 눌려 아무것도 안 읽힌다.
     세로로 긴 그림은 .portrait 를 같이 준다 — 폭을 좁혀야 높이가 산다. */
  .split{ display:flex; gap:1.8rem; align-items:stretch; width:100%; text-align:left; }
  .split > .mediacol{ flex:0 0 44%; display:flex; flex-direction:column; justify-content:center; }
  .split.portrait > .mediacol{ flex:0 0 27%; }
  .split > .textcol{ flex:1; display:flex; flex-direction:column; gap:.7rem; justify-content:center; }
  .split img, .split video{ width:100%; display:block; border-radius:9px; border:1px solid var(--line); }
  /* ⚠️ .card 는 기본 width:300px 다. 두 칸 배치 안에서 그대로 두면 글 칸이 724px 인데
     카드만 300px 라 오른쪽이 텅 빈다 — 슬라이드가 왼쪽으로 쏠려 보이는 원인이다. */
  .split .textcol .card{ width:auto; }

  /* html content slides */
  .htmlslide{ color:var(--fg); width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:6cqh 8cqw; }
  /* ── 왼쪽 정렬 본문 슬라이드 — .htmlslide.left ────────────────────────
     기본 .htmlslide 은 가운데 정렬이다. 표제 한 줄 + 큰 문장에는 그게 맞다.
     그러나 **글머리 목록이 들어가면 가운데 정렬은 읽기가 나빠진다** —
     불릿은 고정 위치인데 글줄 시작점이 줄마다 달라져 왼쪽 경계가 톱니처럼 어긋난다.
     목록·표·문단이 있는 슬라이드는 .left 를 붙인다. (실측 비교로 확인, 2026-08-11) */
  .htmlslide.left{ align-items:flex-start; text-align:left; }
  /* ── 타이포 스케일 — 캔버스가 1600×900 고정이므로 rem 값을 크게 잡는다 ──────
     ⚠️ 함정(2026-08-15 실제 발생): font-size 규칙이 없는 요소는 브라우저 기본 16px 로
     떨어진다. 1600px 폭 캔버스에서 16px 는 본문으로 3배쯤 작고, 빔프로젝터에서 안 읽힌다.
     .pts li / .htmlslide .sub 가 규칙 없이 방치돼 있었다.
     기준: 본문 1.85rem(≈30px) · 부제 1.7rem · 키커 1.35rem · 표 1.5rem.
     새 요소를 추가할 때 font-size 를 빼먹지 말 것. 캔버스 기준이라 rem 이 작아 보인다. */
  .htmlslide{ font-size:1.85rem; line-height:1.5; }
  .htmlslide .sub{ font-size:1.7rem; color:var(--muted); line-height:1.45; }
  .pts{ margin:0; padding-left:1.6em; }
  .pts li{ font-size:1.85rem; line-height:1.5; margin:.75rem 0; color:var(--fg-2); }
  .pts li b{ color:var(--fg); }
  .pts li small, .htmlslide small{ font-size:.72em; color:var(--dim); }
  .htmlslide code{ font-size:.88em; }

  .htmlslide.left > *{ width:100%; max-width:92cqw; }
  /* kicker 는 표지 전용이 아니다 — 본문 슬라이드에서 "이 장이 무엇에 관한 것인지"를
     한 단어로 얹으면 목록만 있는 장의 맥락이 살아난다. */
  .htmlslide .kicker{ color:var(--accent); letter-spacing:3px; text-transform:uppercase; font-size:1.35rem; margin-bottom:1.4rem; }
  .htmlslide.left .kicker{ margin-bottom:.9rem; }
  .titleslide h1{ font-size:4.4rem; font-weight:800; line-height:1.05; margin-bottom:1.6rem; letter-spacing:-1px; }
  .titleslide .sub{ font-size:1.9rem; color:var(--muted); max-width:56ch; margin-bottom:2.6rem; line-height:1.4; }
  /* 개인 발표에서는 이름이 먼저 읽혀야 한다 — 날짜·장소는 그 아래 작게. */
  .titleslide .by{ font-size:2.1rem; color:var(--fg); font-weight:700; letter-spacing:-.5px; }
  .titleslide .by .meta{ font-size:1.35rem; color:var(--dim); font-weight:400;
                         letter-spacing:0; margin-top:.5rem; }
  h2.slidehead{ font-size:2.7rem; margin-bottom:.5rem; }
  h2.slidehead .accent{ color:var(--accent); }
  .slidesubhead{ color:var(--muted); font-size:1.6rem; margin-bottom:2.6rem; }
  .cards{ display:flex; gap:1.6rem; flex-wrap:wrap; justify-content:center; }
  .card{ background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:14px; padding:1.5rem 1.6rem; width:300px; text-align:left; }
  .card h3{ color:var(--accent); font-size:1.65rem; margin-bottom:.5rem; }
  .card p{ color:var(--fg-2); font-size:1.4rem; line-height:1.5; }
  .principles{ counter-reset:p; max-width:66ch; text-align:left; }
  .principles li{ list-style:none; font-size:1.45rem; margin:1.3rem 0; padding-left:3.6rem; position:relative; line-height:1.4; color:var(--fg-2); }
  .principles li::before{ counter-increment:p; content:counter(p); position:absolute; left:0; top:-3px; width:2.4rem; height:2.4rem; background:var(--accent); color:var(--on-accent); font-weight:800; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
  .principles b{ color:var(--fg); }
  #progress { position:fixed; top:0; left:0; height:4px; background:var(--accent); width:0; transition:width .35s ease; z-index:20; }
  /* 나레이션 컨트롤 — counter 와 같은 bottom 규칙을 쓴다(노트를 열면 같이 올라간다) */
  /* ⚠️ #hint 와 같은 좌하단을 쓴다. 같은 bottom 을 주면 버튼이 힌트 글자 위에 겹쳐 앉는다
     (실측: "▶ 듣기" 가 "← → navigate" 를 덮었다). 나레이션을 한 줄 위에 놓고,
     힌트는 body.has-narration 일 때만 아래로 비켜준다 — 오디오 없는 덱은 그대로 둔다. */
  #narrate { position:fixed; bottom:calc(46px + var(--notesH)); left:24px; z-index:21;
    display:flex; align-items:center; gap:12px; transition:bottom .3s ease; }
  body.has-narration #hint { bottom:calc(16px + var(--notesH)); }
  #narrate button { background:var(--card, rgba(255,255,255,.08)); color:var(--fg);
    border:1px solid var(--grip); border-radius:9px; padding:7px 14px;
    font:600 13px/1 inherit; cursor:pointer; min-width:88px; }
  #narrate button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  #narrate button:disabled { opacity:.4; cursor:default; }
  #narrate button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #narrate label { display:flex; align-items:center; gap:6px; color:var(--dim);
    font-size:12.5px; cursor:pointer; user-select:none; }
  @media print { #narrate { display:none } }

  /* ── 나레이션 재생 상태 (본문 창) ─────────────────────────────────
     컨트롤(버튼·체크박스)은 발표자 창에 두지만, **재생 중인지 아닌지**는
     본문 창에서 보여야 한다 — 소리가 나는 창이 본문 창이고, 발표자가
     "지금 나오고 있나?" 를 판단할 곳도 여기다(실제로 확인이 어렵다는 지적을 받았다).
     조작 버튼이 아니라 **상태 표시**라서 청중에게 보여도 군더더기가 아니다. */
  /* 한 줄에 [재생/멈춤 알약] [자동 넘김] — 상태와 조작을 같은 자리에 둔다.
     발표자 창에도 같은 컨트롤이 있고 둘은 양방향으로 동기화된다. */
  #narrctl { position:fixed; bottom:calc(46px + var(--notesH)); left:24px; z-index:21;
    display:none; align-items:center; gap:10px; transition:bottom .3s ease; }
  body.has-narration #narrctl { display:flex; }
  body.has-narration.narr-none #narrctl { display:none; }   /* 이 쪽에 오디오가 없으면 감춘다 */
  #narrstate { display:flex; align-items:center; gap:9px; padding:5px 12px 5px 10px;
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    color:var(--fg-2); font:inherit; font-size:12.5px; font-variant-numeric:tabular-nums;
    cursor:pointer; transition:border-color .15s, color .15s; }
  #narrstate:hover { border-color:var(--accent); color:var(--fg); }
  #narrstate:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #narrstate .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none; }
  #narrauto { display:flex; align-items:center; gap:5px; color:var(--dim); font-size:12px;
    cursor:pointer; user-select:none; }
  #narrauto input { accent-color:var(--accent); width:13px; height:13px; cursor:pointer; }
  #narrauto:hover { color:var(--fg-2); }
  /* 목소리 선택 — VOICES 가 2개 이상일 때만 나타난다(하나뿐이면 고를 게 없다) */
  #narrvoice { display:none; }
  body.narr-multivoice #narrvoice { display:flex; align-items:center; }
  #narrvoice select { background:var(--panel); color:var(--fg-2); border:1px solid var(--line);
    border-radius:999px; padding:4px 8px; font:inherit; font-size:12px; cursor:pointer; }
  #narrvoice select:hover { border-color:var(--accent); color:var(--fg); }
  body.narr-playing #narrstate { color:var(--fg); border-color:var(--accent); }
  body.narr-playing #narrstate .dot { background:var(--accent); animation:narrpulse 1.4s ease-in-out infinite; }
  body.narr-bad #narrstate { border-color:var(--bad); color:var(--bad); }
  body.narr-bad #narrstate .dot { background:var(--bad); animation:none; }
  @keyframes narrpulse { 0%,100%{ opacity:1; transform:scale(1) } 50%{ opacity:.35; transform:scale(.8) } }
  /* 아래쪽 가장자리 = 나레이션 진행. 위쪽 #progress 는 슬라이드 진행이라 헷갈리지 않는다. */
  #narrbar { position:fixed; left:0; right:0; bottom:0; height:3px; z-index:22;
    background:transparent; pointer-events:none; display:none; }
  body.has-narration:not(.narr-none) #narrbar { display:block; }
  #narrbar i { display:block; height:100%; width:0; background:var(--accent); opacity:.85;
    transition:width .2s linear; }
  @media print { #narrctl, #narrbar { display:none !important } }

  /* ── 슬라이드 검색 (`/`) ──────────────────────────────────────────
     장수가 많아지면 「그 얘기 어디 있었지」가 실제 문제가 된다. 발표 중에도 쓴다.
     ⚠️ 색은 전부 토큰으로. 라이트 테마에서 검은 패널이 나오면 안 된다. */
  #find { position:fixed; inset:0; z-index:60; display:none; background:var(--find-scrim, rgba(4,7,12,.55));
          backdrop-filter:blur(3px); align-items:flex-start; justify-content:center; padding-top:12vh; }
  body.find-open #find { display:flex }
  /* --panel 은 반투명이라 그대로 쓰면 뒤 슬라이드 글자가 비친다.
     불투명한 --bg 위에 --panel 을 한 겹 얹어 토큰은 그대로 쓰면서 불투명하게 만든다. */
  #findBox { width:min(760px, 92vw); background-color:var(--bg);
             background-image:linear-gradient(var(--panel), var(--panel));
             border:1px solid var(--line);
             border-radius:14px; box-shadow:0 18px 60px rgba(0,0,0,.45); overflow:hidden; }
  #findInput { width:100%; box-sizing:border-box; border:0; outline:0; background:transparent;
               color:var(--fg); font:inherit; font-size:20px; padding:18px 22px;
               border-bottom:1px solid var(--line); }
  #findInput::placeholder { color:var(--dim) }
  #findList { list-style:none; margin:0; padding:6px; max-height:52vh; overflow-y:auto }
  #findList li { padding:10px 16px; border-radius:9px; cursor:pointer; display:flex; gap:14px; align-items:baseline }
  #findList li.sel { background:var(--accent-soft, rgba(255,179,0,.16)) }
  #findList li:hover { background:var(--accent-soft, rgba(255,179,0,.10)) }
  #findList .fnum { color:var(--accent); font-variant-numeric:tabular-nums; font-size:14px;
                    min-width:2.6em; text-align:right; flex:none }
  #findList .fmain { min-width:0 }
  #findList .ftitle { color:var(--fg); font-size:15px }
  #findList .fsnip { color:var(--muted); font-size:13px; margin-top:3px;
                     overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  #findList mark { background:transparent; color:var(--accent); font-weight:700 }
  #findFoot { padding:9px 20px; border-top:1px solid var(--line); color:var(--dim); font-size:12.5px;
              display:flex; justify-content:space-between; gap:12px }
  @media print { #find { display:none !important } }

  #counter { position:fixed; bottom:calc(18px + var(--notesH)); right:24px; transition:bottom .3s ease; color:var(--fg); opacity:.6; font-size:14px; letter-spacing:1px; z-index:20; font-variant-numeric:tabular-nums; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); z-index:20; width:54px; height:54px; border-radius:50%; border:none; cursor:pointer; background:var(--nav-bg); color:var(--fg); font-size:24px; opacity:0; transition:opacity .25s; }
  #stage:hover .nav { opacity:.5; }
  .nav:hover { opacity:1 !important; background:var(--nav-bg-hover); }
  #prev { left:18px; } #next { right:18px; }
  #notes { position:fixed; left:0; right:0; bottom:0; height:var(--notesHOpen); max-height:var(--notesHOpen); overflow:auto; background:var(--notes-bg); color:var(--fg); padding:22px 32px 28px; transform:translateY(110%); transition:transform .3s ease; z-index:30; border-top:3px solid var(--accent); line-height:1.6; }
  #notes.open, body.notes-open #notes { transform:translateY(0); }
  #notesGrip { position:absolute; top:0; left:0; right:0; height:12px; cursor:ns-resize; z-index:31; }
  #notesGrip::after { content:''; position:absolute; left:50%; top:4px; transform:translateX(-50%);
                      width:64px; height:4px; border-radius:2px; background:var(--grip); transition:background .15s; }
  #notesGrip:hover::after, body.notes-resizing #notesGrip::after { background:var(--accent); }
  body.notes-resizing { user-select:none; cursor:ns-resize; }
  body.notes-resizing #stage, body.notes-resizing #notes { transition:none; }
  #notes h3 { color:var(--accent); font-size:15px; letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
  /* 발표자가 읽는 영역이다. 폭을 980px 로 못 박아두면 넓은 화면에서
     서랍은 꽉 차는데 글만 왼쪽에 몰려 어색하고, 글자도 작아서 잘 안 읽힌다.
     → 화면을 따라 넓어지되 한 줄이 너무 길어지지 않게 상한을 두고 가운데로,
       글자 크기도 창 폭에 맞춰 키운다. */
  #notes h3, #notes p { max-width:min(1600px, 100%); margin-left:auto; margin-right:auto; }
  #notes p { font-size:clamp(17px, 1.05vw, 23px); }
  #notes .cue { color:var(--accent); font-weight:600; }
  /* 소리내어 강조할 말 — 발표자만 본다 */
  #notes .hit { color:#fff; font-weight:700; text-decoration:underline;
    text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:3px; }
  #hint { position:fixed; bottom:calc(18px + var(--notesH)); left:24px; transition:bottom .3s ease; color:var(--fg); opacity:.4; font-size:13px; z-index:20; }

  /* ── 이 덱 전용 (접두사 h — 엔진 클래스와 안 부딪히게) ───────────────── */
  .hgold{ color:var(--accent); }
  /* 한국어는 어절 중간에서 줄이 꺾이면 안 읽힌다 (첫 캡처에서 '플러/그인' 처럼 끊겼다) */
  .htmlslide{ word-break:keep-all; overflow-wrap:break-word; }
  /* 템플릿 키커의 자간 3px 은 영문 대문자용이다. 한글에 그대로 주면 '써 볼 만 한 것' 처럼 흩어진다 */
  .htmlslide .kicker{ letter-spacing:1px; font-size:1.45rem; }
  .htitle{ display:flex; align-items:center; gap:3.5cqw; width:100%; text-align:left; }
  .htitle-text{ flex:1; min-width:0; }
  .htitle .sub{ margin-bottom:2.2rem; }
  .hmascot{ flex:0 0 auto; height:62cqh; width:auto; filter:drop-shadow(0 18px 40px var(--shadow)); }
  h2.hh{ font-size:3.1rem; line-height:1.2; margin-bottom:2.2cqh; letter-spacing:-.5px; color:var(--fg); }
  .hgrid{ display:grid; gap:1.4rem; }
  .hgrid.two{ grid-template-columns:1fr 1fr; }
  .hgrid.three{ grid-template-columns:1fr 1fr 1fr; }
  .hcard{ background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--accent);
          border-radius:14px; padding:1.3rem 1.5rem 1.1rem; }
  .hcard h3{ color:var(--accent); font-size:2.1rem; margin-bottom:.6rem; line-height:1.25; }
  .hcard h3 small{ color:var(--dim); font-size:1.45rem; font-weight:500; margin-left:.3rem; }
  .hcard ul{ margin:0; padding-left:1.2em; }
  .hcard li{ font-size:1.85rem; line-height:1.42; margin:.5rem 0; color:var(--fg-2); }
  .hgrid.three .hcard li{ font-size:1.7rem; }
  .hcard li b{ color:var(--fg); }
  .hcard li small{ font-size:.85em; color:var(--dim); }
  .hcard li.warn::marker{ color:var(--bad); }
  .hcard code{ font-size:.9em; color:var(--fg); background:var(--panel); padding:.05em .3em; border-radius:5px; }
  .hcard code, .hnw{ white-space:nowrap; }
  .hcard-warn{ border-top-color:var(--bad); }
  .hstat{ font-size:3.1rem; font-weight:800; color:var(--fg); letter-spacing:-.5px; line-height:1.1; margin-bottom:.4rem; }
  .hnote{ margin-top:1.4rem; padding:1rem 1.4rem; border-left:4px solid var(--accent); background:var(--panel);
          border-radius:8px; font-size:1.75rem; line-height:1.45; color:var(--fg); }
  .hnote b{ color:var(--accent); }
  .hsrc{ margin-top:1.4rem; font-size:1.4rem; color:var(--dim); }
  /* ⚠️ 이 블록은 **스타일시트 맨 끝**에 있어야 한다.
     @media print 안이라고 우선하는 게 아니다 — 특정도가 같으면 **나중 규칙이 이긴다.**
     앞쪽에 두면 뒤의 #stage{position:fixed} 가 그대로 살아 인쇄해도 한 장만 나온다. */
  /* ── 인쇄 / PDF ────────────────────────────────────────────────────
     브라우저 인쇄로 PDF 를 뽑으면 **한 장에 한 슬라이드**가 나온다.
     화면용 장치(scale·절대배치·노트 서랍·네비게이션)를 전부 끄고,
     슬라이드를 문서 흐름으로 되돌려 페이지마다 끊는다.
     용지는 가로 16:9 로 잡는다 — @page size 가 먹지 않는 브라우저에서도
     .slide 크기가 그대로라 비율은 유지된다. */
  @page { size: 1600px 900px; margin: 0; }
  @media print {
    html, body { width:auto; height:auto; overflow:visible; background:#fff; }
    /* display:block 이 핵심 — #stage 는 화면에서 flex 라, 안 바꾸면
       슬라이드가 세로로 쌓이지 않고 **가로로 늘어서** 페이지가 안 나뉜다. */
    #stage { position:static; inset:auto; width:auto; height:auto; display:block; }
    #stage .slide {
      position:relative; left:auto; top:auto; margin:0;
      width:1600px; height:900px;
      transform:none !important;            /* scale 을 끄지 않으면 여백만 남는다 */
      display:flex !important; opacity:1 !important; visibility:visible !important;
      break-after:page; page-break-after:always;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;   /* 배경 이미지·판 색을 살린다 */
    }
    #stage .slide:last-child { break-after:auto; page-break-after:auto; }
    /* 화면 전용 UI 는 인쇄하지 않는다 */
    .nav, #counter, #hint, #progress, #notes, #notesGrip { display:none !important; }
    .cp { display:none !important; }        /* 복사 버튼 */
    .scrollbox { max-height:none !important; overflow:visible !important; }
  }

  /* ── 전환(슬라이드 간) · 등장(내용) ───────────────────────────────
     html[data-transition] · html[data-reveal] 로 고른다. 기본은 fade + none.
       transition: fade | rise | push | none
       reveal:     none | stagger
     --ease 는 처음에 빠르고 끝에서 부드럽게 멎는 곡선이다. 이게 "스르륵" 을 만든다. */
  :root { --ease:cubic-bezier(.16, 1, .3, 1); --dur:.55s; --rise:26px; }
  html[data-transition="none"] { --dur:0s; }

  /* rise — 새 쪽이 살짝 아래에서 올라오며 나타난다 */
  html[data-transition="rise"] #stage .slide {
    transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    transform:scale(var(--slideScale, 1)) translateY(var(--rise)); }
  html[data-transition="rise"] #stage .slide.active {
    transform:scale(var(--slideScale, 1)) translateY(0); }

  /* push — 옆에서 밀려 들어온다 */
  html[data-transition="push"] #stage .slide {
    transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    transform:scale(var(--slideScale, 1)) translateX(4%); }
  html[data-transition="push"] #stage .slide.active {
    transform:scale(var(--slideScale, 1)) translateX(0); }

  /* 등장 — 슬라이드 안 요소가 차례로 올라온다.
     ⚠️ 지연을 손으로 매기지 않는다. 쪽을 고칠 때마다 다시 매겨야 하기 때문이다.
        :nth-child() 로 자동 계산한다 (8번째부터는 같은 지연을 공유). */
  html[data-reveal="stagger"] .slide.active .htmlslide > *,
  html[data-reveal="stagger"] .slide.active .diagramslide > * {
    animation:revealUp var(--dur) var(--ease) both; }
  @keyframes revealUp { from { opacity:0; transform:translateY(var(--rise)); }
                          to { opacity:1; transform:none; } }
  html[data-reveal="stagger"] .slide.active .htmlslide > :nth-child(1),
  html[data-reveal="stagger"] .slide.active .diagramslide > :nth-child(1) { animation-delay:.05s }
  html[data-reveal="stagger"] .slide.active .htmlslide > :nth-child(2),
  html[data-reveal="stagger"] .slide.active .diagramslide > :nth-child(2) { animation-delay:.15s }
  html[data-reveal="stagger"] .slide.active .htmlslide > :nth-child(3),
  html[data-reveal="stagger"] .slide.active .diagramslide > :nth-child(3) { animation-delay:.25s }
  html[data-reveal="stagger"] .slide.active .htmlslide > :nth-child(4),
  html[data-reveal="stagger"] .slide.active .diagramslide > :nth-child(4) { animation-delay:.35s }
  html[data-reveal="stagger"] .slide.active .htmlslide > :nth-child(5),
  html[data-reveal="stagger"] .slide.active .diagramslide > :nth-child(5) { animation-delay:.45s }
  html[data-reveal="stagger"] .slide.active .htmlslide > :nth-child(6),
  html[data-reveal="stagger"] .slide.active .diagramslide > :nth-child(6) { animation-delay:.55s }
  html[data-reveal="stagger"] .slide.active .htmlslide > :nth-child(n+7),
  html[data-reveal="stagger"] .slide.active .diagramslide > :nth-child(n+7) { animation-delay:.65s }

  /* 움직임을 줄여달라고 설정한 사람에게는 전부 끈다 (OS 접근성 설정) */
  @media (prefers-reduced-motion: reduce) {
    :root { --dur:.01s; --rise:0px; }
    html[data-reveal="stagger"] .slide.active *[class] { animation:none !important; }
  }


  /* ── 인쇄 안전장치 ─────────────────────────────────────────────────
     ⚠️ 전환·등장 블록이 위의 @media print 보다 **뒤에** 있다. 특정도가 같으면
        나중 규칙이 이기므로, 인쇄에서 등장 애니메이션이 시작 상태(opacity:0)로
        굳어 **빈 페이지**가 나올 수 있다. 그래서 여기서 다시 끈다.
     배경 이미지는 브라우저가 기본적으로 인쇄에서 뺀다 — exact 로 살린다. */
  @media print {
    /* 종이는 흰색이다. 어두운 테마 토큰을 그대로 두면 밝은 회색 글자가 흰 종이에
       찍혀 **제목이 거의 안 보인다.** 규칙은 하나도 안 건드리고 토큰만 밝은 값으로
       갈아끼운다 — 색을 이름으로 쓴 덕에 여기 한 곳이면 끝난다.
       ⚠️ 선택자를 `:root` 만 쓰면 안 된다. 위의 html[data-theme="midnight"] 이
          특정도가 더 높아 이긴다. html[data-theme] 로 같은 급을 만들어 둔다. */
    :root, html[data-theme] {
      --bg:#ffffff; --panel:rgba(0,0,0,.04); --line:rgba(0,0,0,.18);
      --fg:#12141a; --fg-2:#333a45; --muted:#4d5460; --dim:#6b7280;
      --accent:#9a5b00; --on-accent:#ffffff;
      --plate:#ffffff; --shadow:rgba(0,0,0,.16);
    }
    #stage .slide, #stage .slide * { animation:none !important; transition:none !important; }
    #stage .slide > * { opacity:1 !important; transform:none !important; }
    .slide.hasbg { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    /* 유인물에 재생 바가 찍히면 군더더기다. 영상은 poster 한 장으로 남긴다. */
    video.media::-webkit-media-controls { display:none !important; }
  }

</style>
</head>
<body>
<div id="progress"></div>
<div id="stage">
  <button id="prev" class="nav" aria-label="Previous">‹</button>
  <button id="next" class="nav" aria-label="Next">›</button>

SLIDES.forEach((s, idx) => {
  const div = document.createElement('div');
  div.className = 'slide' + (idx === 0 ? ' active' : '');
  const src = s.img || s.photo || s.video;
  if (src || s.embed) {
    const wrap = document.createElement('div'); wrap.className = 'diagramslide';
    wrap.innerHTML = (s.head ? "<h2 class='slidehead'>" + s.head + "</h2>" : "")
                   + (s.sub ? "<div class='slidesubhead'>" + s.sub + "</div>" : "");
    let el;
    if (s.embed) {
      el = document.createElement('div'); el.className = 'embed'; el.innerHTML = s.embed;
    } else if (s.video) {
      el = document.createElement('video'); el.className = 'media'; el.src = s.video;
      el.controls = true; el.playsInline = true;
      if (s.poster) el.poster = s.poster;
      if (s.loop) el.loop = true;
      if (s.muted) el.muted = true;
      // ⚠️ autoplay 는 여기서 속성으로 걸지 않는다. 그러면 뒤쪽 슬라이드의 영상까지
      //    페이지를 열자마자 같이 돈다. 화면에 들어올 때만 재생한다(activateMedia).
      if (s.autoplay) el.dataset.autoplay = '1';
    } else {
      el = document.createElement('img'); el.src = src; el.alt = s.title || '';
      el.className = s.photo ? 'photo' : 'diagram';
    }
    if (!s.embed) el.onerror = () => {
      el.insertAdjacentHTML('afterend', '<div class="missing">⏳ ' + src + '<br><small>still generating — refresh when ready</small></div>');
      el.remove();
    };
    wrap.appendChild(el);
    if (s.cap) wrap.insertAdjacentHTML('beforeend', "<div class='mediacap'>" + s.cap + "</div>");
    div.appendChild(wrap);
  } else { div.innerHTML = s.html; }
  if (s.bg) {
    div.classList.add('hasbg');
    div.style.backgroundImage = "url('" + s.bg + "')";
    if (s.bgDim != null) div.style.setProperty('--bgDim', s.bgDim);
  }
  stage.appendChild(div);

// ---- 코드 블록 복사 버튼 ----
// 덱이 Pages 로 배포돼 참석자도 각자 연다. 명령을 받아치면 오타가 나므로 눌러서 가져가게 한다.
(function addCopyButtons(){
  document.querySelectorAll('.code').forEach(el => {
    if (el.querySelector('.cp')) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cp'; b.textContent = '\u29c9'; b.title = '복사';
    b.addEventListener('click', async ev => {
      ev.stopPropagation();
      const clone = el.cloneNode(true);
      clone.querySelectorAll('.cp').forEach(x => x.remove());
      const text = clone.textContent.replace(/\u00a0/g, ' ').replace(/^\n+|\s+$/g, '');
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
        // file:// 등에서 clipboard API 가 막히면 옛 방식으로
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { ok = document.execCommand('copy'); } catch (e2) {}
        ta.remove();
      }
      b.textContent = ok ? '\u2713' : '\u2715';
      b.classList.add(ok ? 'ok' : 'no');
      setTimeout(() => { b.textContent = '\u29c9'; b.classList.remove('ok', 'no'); }, 1200);
    });
    el.appendChild(b);
  });
})();

function activateMedia(el) {
  document.querySelectorAll('.slide video').forEach(v => {
    if (!el.contains(v)) { v.pause(); v.currentTime = 0; }
  });
  el.querySelectorAll('.anim').forEach(a => {
    const c = a.cloneNode(true); a.parentNode.replaceChild(c, a);
  });
  el.querySelectorAll('video[data-autoplay]').forEach(v => {
    v.currentTime = 0;
    // 소리 있는 영상의 자동재생은 브라우저가 막을 수 있다. 막히면 조용히 두고
    // 발표자가 컨트롤로 직접 튼다 — 억지로 음소거해서 트는 게 더 나쁘다.
    const p = v.play(); if (p) p.catch(() => {});
  });
}

function render() {
  document.querySelectorAll('.slide').forEach((el, idx) => el.classList.toggle('active', idx === i));
  activateMedia(document.querySelectorAll('.slide')[i]);
  counter.textContent = (i + 1) + ' / ' + SLIDES.length;
  progress.style.width = ((i + 1) / SLIDES.length * 100) + '%';
  notesTitle.textContent = SLIDES[i].title; notesBody.innerHTML = SLIDES[i].note; updatePresenter(); saveState();
  narrate();
}
function go(n) { i = Math.max(0, Math.min(SLIDES.length - 1, n)); render(); }

/* ---- 나레이션 (선택) ----
   슬라이드에 audio:"파일.mp3" 가 하나라도 있으면 컨트롤이 나타난다. 없으면 흔적도 없다.

   ⚠️ 자동 넘김을 타이머로 하지 않는다. 오디오의 ended 로 넘긴다 —
   TTS 길이는 문장마다 다르고, 타이머로 맞추면 말이 잘리거나 빈 화면이 남는다.
   ⚠️ 첫 재생은 사용자 조작(버튼)에서 시작해야 한다. 자동재생은 브라우저가 막는다.
*/
const HAS_AUDIO = SLIDES.some(s => s.audio);

/* ── 나레이션 ──
   ⚠️ 컨트롤(재생·자동넘김·목소리)은 **발표자 창에만** 둔다.
   본문 창은 화면 공유 대상이라, 여기에 버튼이 있으면 발표 내내 청중에게 보인다.
   소리는 본문 창의 <audio> 가 낸다 — 발표자 창은 조작만 postMessage 로 보낸다.
   ⚠️ 자동 넘김은 타이머가 아니라 오디오의 ended 로 한다. TTS 길이는 문장마다 다르다. */
/* ⚠️ **이 덱이 실제로 가진 폴더만** 적는다. 다른 덱에서 복사해 오면 여기에 없는
   폴더가 남고, NARR_DIR(슬라이드 경로에서 읽는다)과 어긋나 select.value 가 어느
   option 과도 안 맞는다 ⇒ 발표자 창 셀렉트가 **빈 채로 뜬다**(2026-08-23 실측).
   목소리가 하나면 아래 셀렉트는 자동으로 숨는다. */
const VOICES = [
  { dir:"assets/__NARR_DIR__", label:"Gemini (Charon)" }
];
/* 지금 쓰는 목소리 폴더. 발표자 창의 셀렉트가 이 값을 비춘다(updatePresenter).
   초기값은 **슬라이드에 적힌 실제 경로에서 읽는다** — VOICES[0] 로 고정하면
   덱이 다른 폴더를 쓰고 있을 때 셀렉트가 처음부터 엉뚱한 항목을 가리킨다. */
let NARR_DIR = (() => {
  const s = SLIDES.find(x => x.audio);
  const d = s ? s.audio.split('/').slice(0, -1).join('/') : '';
  return d || (VOICES[0] ? VOICES[0].dir : '');
})();
/* 목소리를 갈아끼운다 — 파일명은 그대로 두고 **폴더만** 바꾼다.
   ⇒ 목소리별 폴더는 같은 파일명 규약(sNN.mp3)을 공유해야 한다.
   ⚠️ 이 함수가 없던 동안 setVoice() 가 ReferenceError 로 죽었다. 목소리가 한 종류면
      셀렉트를 건드릴 일이 없어 드러나지 않는다 — VOICES 를 늘릴 때만 밟는 함정이었다. */
function applyVoice(dir) {
  NARR_DIR = dir;
  SLIDES.forEach(s => { if (s.audio) s.audio = dir + '/' + s.audio.split('/').pop(); });
}
let playing = false, audioEl = null, autoAdvance = true, audioBad = false;

function narrate() {
  if (!HAS_AUDIO || !audioEl) return;
  const src = SLIDES[i].audio;
  audioEl.pause(); audioEl.currentTime = 0;
  if (!src) { playing = false; updatePresenter(); return; }
  audioEl.src = src;
  if (playing) audioEl.play().catch(() => { playing = false; updatePresenter(); });
  updatePresenter();
}
function toggleNarration() {
  if (!HAS_AUDIO || !audioEl || !SLIDES[i].audio) return;
  if (playing) { audioEl.pause(); playing = false; }
  else { playing = true; audioEl.play().catch(() => { playing = false; updatePresenter(); }); }
  updatePresenter();
}
function setVoice(dir) {
  const wasPlaying = playing;
  applyVoice(dir);
  if (!audioEl) return;
  audioEl.pause();
  audioBad = false;
  audioEl.src = SLIDES[i].audio || '';
  audioEl.currentTime = 0;
  playing = false;
  if (wasPlaying && SLIDES[i].audio) {
    /* ⚠️ src 를 갈아끼운 직후 play() 하면 아직 로드 전이라 거부된다(AbortError).
       canplay 를 한 번만 기다렸다 재생한다. */
    const once = () => {
      audioEl.removeEventListener('canplay', once);
      playing = true;
      audioEl.play().catch(() => { playing = false; updatePresenter(); });
      updatePresenter();
    };
    audioEl.addEventListener('canplay', once);
    audioEl.load();
  }
  updatePresenter();
}
if (HAS_AUDIO) {
  audioEl = document.createElement('audio');
  audioEl.preload = 'auto';
  audioEl.addEventListener('ended', () => {
    if (autoAdvance && i + 1 < SLIDES.length) go(i + 1);
    else { playing = false; updatePresenter(); }
  });
  /* 파일이 없으면 조용히 멈추지 말고 발표자 창에 알린다 —
     목소리 폴더 하나가 통째로 비어 있어도 눈치채지 못한 적이 있다. */
  audioEl.addEventListener('error', () => { playing = false; audioBad = true; updatePresenter(); });
  audioEl.addEventListener('loadeddata', () => { audioBad = false; updatePresenter(); });
  document.body.appendChild(audioEl);
  const _h = document.getElementById('hint');
  if (_h) _h.textContent = '← → navigate · N notes · ⇧N narration · P presenter window · F fullscreen';
  document.body.classList.add('has-narration');
  /* ⚠️ 클릭 뒤 blur() 를 반드시 한다. 버튼에 포커스가 남으면 Space 가 "다음 장" 이 아니라
     버튼 클릭이 되고, 체크박스에 남으면 단축키 가드(INPUT 이면 무시)에 걸려 방향키가 죽는다. */
  const _nb = document.getElementById('narrstate');
  if (_nb) _nb.addEventListener('click', () => { toggleNarration(); _nb.blur(); });
  const _na = document.querySelector('#narrauto input');
  if (_na) _na.addEventListener('change', () => {
    autoAdvance = _na.checked; _na.blur(); updatePresenter();
  });
  /* 목소리(=오디오 폴더) 선택. 파일명은 그대로 두고 폴더만 갈아끼운다 → applyVoice() */
  const _nv = document.querySelector('#narrvoice select');
  if (_nv && VOICES.length > 1) {
    document.body.classList.add('narr-multivoice');
    VOICES.forEach(v => {
      const o = document.createElement('option');
      o.value = v.dir; o.textContent = v.label; _nv.appendChild(o);
    });
    _nv.value = NARR_DIR;
    _nv.addEventListener('change', () => { setVoice(_nv.value); _nv.blur(); });
  }
  /* 상태 표시는 오디오 이벤트에서만 갱신한다 — 타이머로 그리면 재생이 멈춘 뒤에도 계속 돈다. */
  ['timeupdate','loadedmetadata','durationchange','play','pause','ended','error'].forEach(
    ev => audioEl.addEventListener(ev, updateNarrUI));
  updateNarrUI();
}

function fmtSec(t) {
  if (!isFinite(t) || t < 0) t = 0;
  return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
}
/* 본문 창의 재생 상태 — 점(재생 중 깜빡임) + 경과/전체 + 아래 가장자리 진행바.
   ⚠️ 조작 버튼은 여기 두지 않는다(발표자 창 몫). 여기 있는 건 **상태**뿐이다. */
function updateNarrUI() {
  const st = document.getElementById('narrstate'), bar = document.querySelector('#narrbar i');
  if (!st || !audioEl) return;
  const has = !!(SLIDES[i] && SLIDES[i].audio);
  document.body.classList.toggle('narr-none', !has);
  document.body.classList.toggle('narr-playing', playing && !audioEl.paused);
  document.body.classList.toggle('narr-bad', audioBad);
  const chk = document.querySelector('#narrauto input');
  if (chk && chk.checked !== autoAdvance) chk.checked = autoAdvance;   /* 발표자 창 ↔ 본문 동기화 */
  const sel = document.querySelector('#narrvoice select');
  if (sel && sel.value !== NARR_DIR) sel.value = NARR_DIR;
  const d = audioEl.duration, t = audioEl.currentTime;
  document.getElementById('narrtime').textContent =
    audioBad ? '파일 없음'
    : (playing && !audioEl.paused ? '▶ ' : '❚❚ ') + fmtSec(t) + ' / ' + fmtSec(d || 0);
  if (bar) bar.style.width = (d > 0 ? (t / d * 100) : 0).toFixed(2) + '%';
}

// ---- 상태 유지: 새로고침해도 보던 쪽과 노트 열림이 그대로 ----
// 해시를 1차로 쓴다. file:// 에서 localStorage 는 SecurityError 가 날 수 있고,
// 해시는 어디서나 되며 "특정 쪽 링크"로도 쓸 수 있다.
const DECK_KEY = 'deck:' + location.pathname;
function notesOpen(){ return document.body.classList.contains('notes-open'); }
function saveState(){
  const st = 's=' + (i + 1) + (notesOpen() ? '&n=1' : '') + (notesH !== DEFAULT_NOTES_H ? '&h=' + notesH : '');
  try { history.replaceState(null, '', '#' + st); } catch (e) { location.hash = st; }
  try { localStorage.setItem(DECK_KEY, st); } catch (e) {}
}
function loadState(){
  let raw = location.hash.replace(/^#/, '');
  if (!raw) { try { raw = localStorage.getItem(DECK_KEY) || ''; } catch (e) {} }
  const p = new URLSearchParams(raw);
  const n = parseInt(p.get('s'), 10);
  const h = parseFloat(p.get('h'));
  return { idx: Number.isFinite(n) ? Math.max(0, Math.min(SLIDES.length - 1, n - 1)) : 0,
           notes: p.get('n') === '1',
           h: Number.isFinite(h) ? h : DEFAULT_NOTES_H };
}
function fitSlide(){
  // 고정 캔버스(--deckW × --deckH)를 남은 무대에 맞춰 **한 번에** 축소한다.
  // 가로·세로 중 더 빡빡한 쪽을 따라가므로 **비율이 그대로 유지**된다.
  // getBoundingClientRect 로 무대를 재면 전환 애니메이션 중간값이 잡히므로 계산으로 구한다.
  const cs = getComputedStyle(document.body);
  const px = name => { const v = cs.getPropertyValue(name).trim();
    return v.endsWith('vh') ? parseFloat(v) / 100 * innerHeight : (parseFloat(v) || 0); };
  const W = px('--deckW') || 1600, H = px('--deckH') || 900;
  const availH = innerHeight - px('--notesH') - px('--stagePad');
  const s = Math.min(innerWidth / W, availH / H);
  document.body.style.setProperty('--slideScale', (s > 0 ? s : 0.1).toFixed(5));
}
// ---- 노트 서랍 높이 조절 (드래그) ----
// 서랍이 커지면 슬라이드가 그만큼 작아진다. 발표자가 그 균형을 직접 잡게 한다.
const DEFAULT_NOTES_H = 38, MIN_NOTES_H = 14, MAX_NOTES_H = 72;
let notesH = DEFAULT_NOTES_H;
function setNotesH(vh, save){
  notesH = Math.round(Math.min(MAX_NOTES_H, Math.max(MIN_NOTES_H, vh)) * 10) / 10;
  document.body.style.setProperty('--notesHOpen', notesH + 'vh');
  fitSlide();
  if (save) saveState();
}
(function initGrip(){
  const grip = document.getElementById('notesGrip');
  if (!grip) return;
  let dragging = false;
  grip.addEventListener('pointerdown', e => {
    dragging = true; document.body.classList.add('notes-resizing');
    grip.setPointerCapture(e.pointerId); e.preventDefault();
  });
  grip.addEventListener('pointermove', e => {
    if (dragging) setNotesH((window.innerHeight - e.clientY) / window.innerHeight * 100, false);
  });
  const stop = () => { if (!dragging) return; dragging = false;
    document.body.classList.remove('notes-resizing'); saveState(); };
  grip.addEventListener('pointerup', stop);
  grip.addEventListener('pointercancel', stop);
  grip.addEventListener('dblclick', () => setNotesH(DEFAULT_NOTES_H, true));   // 기본값으로
})();
function toggleNotes(){ document.body.classList.toggle('notes-open'); fitSlide(); saveState(); }
window.addEventListener('resize', fitSlide);

document.getElementById('next').onclick = () => go(i + 1);
document.getElementById('prev').onclick = () => go(i - 1);

// ---- Presenter window: separate window, NOT captured when you share only the slides tab ----
let presWin = null, startMs = null;

window.deckNav        = d  => go(i + d);
window.deckGoto       = n  => go(n);
window.deckResetTimer = () => { startMs = Date.now(); updatePresenter(); };
window.deckTogglePresenter = () => togglePresenter();
window.deckToggleNarration = () => { if (typeof toggleNarration === 'function') toggleNarration(); };
window.deckAdopt = w => {            // 발표자 창이 새 본문에 자기를 다시 붙인다
  if (!w || w.closed) return false;
  presWin = w; startMs = startMs || Date.now(); updatePresenter(); return true;
};
function fmt(ms){ const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
/* ⚠️ 여기 있던 navKey() 를 지웠다(2026-08-19). 정의만 되고 **등록되지 않은 죽은 코드**였고,
   실제로 도는 아래 keydown 핸들러와 N 의 뜻이 서로 달랐다 — #hint 는 "N narration" 이라
   약속하는데 N 은 노트 드로어만 열었다. 단축키는 아래 한 곳에서만 정한다. */
function togglePresenter(){ if(presWin && !presWin.closed){ presWin.close(); presWin = null; return; } openPresenter(); }
function openPresenter(){

       않으므로 여기서 var(--fg) 를 쓰면 선언이 통째로 무효가 되고, 노트가 브라우저

       누군가 나중에 var(--*) 를 쓰더라도 풀리도록 토큰을 다시 선언해 둔다.
       ⚠️ 이 설명을 CSS 주석으로 문자열 안에 넣지 마라 — JS 문자열은 줄을 넘지 못해서
          여러 줄로 쓰는 순간 스크립트 전체가 죽는다 (실제로 그렇게 깨져 있었다). */
      + ':root{--fg:#e8ecf4;--fg-2:#c7cfdd;--muted:#94a3b8;--dim:#64748b;--bg:#13234a;--panel:#1b2d58;--line:#2a3242;--accent:#FFB300;--on-accent:#0c1018;}'

    /* ⚠️ 이 스크립트는 반드시 </body> 앞에, 그리고 한 줄이므로 // 주석 금지.
       주석을 넣으면 그 줄의 나머지가 전부 죽는다(실측). */
    + '<scr'+'ipt>(function(){var START=Date.now(),$=function(x){return document.getElementById(x);};function send(t,d){try{if(window.opener&&!window.opener.closed)window.opener.postMessage({deck:1,t:t,d:d},\'*\');}catch(e){}}window.addEventListener(\'message\',function(ev){var m=ev.data;if(!m||m.deck!==1||m.t!==\'state\')return;$(\'pcount\').textContent=\'Slide \'+(m.idx+1)+\' / \'+m.total;$(\'ptitle\').textContent=m.title;$(\'pnote\').innerHTML=m.note;$(\'pnext\').innerHTML=m.next;if(m.start)START=m.start;var nb=$(\'pnarr\');if(!m.audio){nb.className=\'\';}else{nb.className=\'on\';$(\'pplay\').textContent=m.playing?\'❚❚ 멈춤\':\'▶ 듣기\';$(\'pplay\').disabled=!m.hasSrc;$(\'pauto\').checked=!!m.auto;var sel=$(\'pvoice\');var vs=m.voices||[];var vw=sel.parentNode;vw.style.display=(vs.length>1?\'\':\'none\');if(sel.options.length!==vs.length){sel.innerHTML=\'\';vs.forEach(function(v){var o=document.createElement(\'option\');o.value=v.dir;o.textContent=v.label;sel.appendChild(o);});}if(sel.value!==m.voice)sel.value=m.voice;}});$(\'pp\').onclick=function(){send(\'nav\',-1);};$(\'pn\').onclick=function(){send(\'nav\',1);};$(\'pr\').onclick=function(){send(\'reset\');};$(\'pplay\').onclick=function(){send(\'narr\');};$(\'pauto\').onchange=function(){send(\'auto\',this.checked);};$(\'pvoice\').onchange=function(){send(\'voice\',this.value);};document.addEventListener(\'keydown\',function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;var t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName||\'\')))return;var k=e.key,c=e.code;if(k===\'ArrowRight\'||k===\' \'||k===\'PageDown\'||c===\'Space\'||c===\'PageDown\'){e.preventDefault();send(\'nav\',1);}else if(k===\'ArrowLeft\'||k===\'PageUp\'||c===\'PageUp\'){e.preventDefault();send(\'nav\',-1);}else if(k===\'Escape\'||c===\'KeyP\'){e.preventDefault();send(\'toggleP\');}else if(c===\'KeyN\'&&e.shiftKey){e.preventDefault();send(\'narr\');}});setInterval(function(){send(\'hello\');},700);setInterval(function(){var s=Math.floor((Date.now()-START)/1000);$(\'ptimer\').textContent=(\'0\'+Math.floor(s/60)).slice(-2)+\':\'+(\'0\'+(s%60)).slice(-2);},250);send(\'hello\');})();</scr'+'ipt>'
    + '</body></html>');
  presWin.document.close();
  if(!startMs) startMs = Date.now();
  updatePresenter();
}
function updatePresenter(){
  /* 본문 창의 재생 상태 표시는 발표자 창이 없어도 갱신해야 한다 —
     아래 early return 뒤에 두면 발표자 창을 안 열었을 때 상태가 멈춘다. */
  if (typeof updateNarrUI === 'function') updateNarrUI();
  if(!presWin || presWin.closed) return;
  /* ⚠️ file:// 은 origin 이 null 이라, 본문을 새로고침하면 발표자 창이 cross-origin 으로 막힌다.
     DOM 을 직접 건드리지 말고 postMessage 로 상태만 넘긴다 — 이건 cross-origin 에서도 된다. */
  try {
    presWin.postMessage({ deck:1, t:'state', idx:i, total:SLIDES.length,
      title:SLIDES[i].title || '', note:SLIDES[i].note || '',
      next:(i+1 < SLIDES.length) ? ('▶ Next: ' + SLIDES[i+1].title) : '— last slide —',
      start:startMs, audio:HAS_AUDIO, playing:playing,
      hasSrc:!!(SLIDES[i] && SLIDES[i].audio), auto:autoAdvance, bad:audioBad,
      voice:(typeof NARR_DIR!=='undefined'?NARR_DIR:''), voices:(typeof VOICES!=='undefined'?VOICES:[]) }, '*');
  } catch(e) {}
}

/* 발표자 창에서 오는 조작을 받는다. hello 로 창 참조를 (새로고침 뒤에도) 되찾는다. */
window.addEventListener('message', ev => {
  const m = ev.data; if(!m || m.deck !== 1) return;
  if(m.t === 'hello'){ if(presWin !== ev.source){ presWin = ev.source; startMs = startMs || Date.now(); } updatePresenter(); }
  else if(m.t === 'nav')    go(i + m.d);
  else if(m.t === 'reset'){ startMs = Date.now(); updatePresenter(); }
  else if(m.t === 'toggleP') togglePresenter();
  else if(m.t === 'narr')  toggleNarration();
  else if(m.t === 'auto'){ autoAdvance = !!m.d; updatePresenter(); }
  else if(m.t === 'voice') setVoice(m.d);
});

/* 타이머는 발표자 창이 스스로 돌린다. 본문에서 presWin.document 를 만지면
   file:// 새로고침 뒤 cross-origin 으로 막혀 에러가 쏟아진다(실측). */

/* ── 슬라이드 검색 ──────────────────────────────────────────────────
   79장이 되면 「thinking 잘린다는 얘기 어디 있었지」를 눈으로 못 찾는다.
   제목·본문·발표 노트를 전부 훑는다 — 노트에만 있는 말도 찾아야 쓸모가 있다. */
const _fx = document.createElement('div');
function plain(html) {                       // 태그를 걷어내고 텍스트만
  if (!html) return '';
  // ⚠️ 태그를 그냥 지우면 <li>가</li><li>나</li> 가 '가나' 로 붙는다.
  //    태그 앞에 공백을 넣어야 스니펫에서 단어가 뭉개지지 않는다.
  _fx.innerHTML = String(html).replace(/</g, ' <');
  _fx.querySelectorAll('style,script').forEach(n => n.remove());   // embed 의 CSS 가 섞이면 안 된다
  return (_fx.textContent || '').replace(/\s+/g, ' ').trim();
}
const FIND_IX = SLIDES.map((sl, n) => {
  const title = sl.title || ('슬라이드 ' + (n + 1));
  // head 에 title 은 넣지 않는다 — 결과 줄에 제목이 이미 있어서 스니펫이 그걸 되풀이한다
  const head = [plain(sl.head), plain(sl.sub), plain(sl.cap)].filter(Boolean).join(' · ');
  const body = [plain(sl.html), plain(sl.embed), plain(sl.note)].filter(Boolean).join(' ');
  return { n, title, head, body,
           hay: (title + ' ' + head + ' ' + body).toLowerCase() };
});
const findEl = document.getElementById('find');
const findInput = document.getElementById('findInput');
const findList = document.getElementById('findList');
const findCount = document.getElementById('findCount');
let findHits = [], findSel = 0;

function esc(t) { return t.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function mark(text, q) {                     // 매칭만 강조. 정규식 특수문자를 그대로 넣으면 터진다
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function snippet(text, q, pad) {              // 매칭 앞뒤만 잘라 한 줄로
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return text.slice(0, pad * 3) + (text.length > pad * 3 ? ' …' : '');
  const a = Math.max(0, i - pad), b = Math.min(text.length, i + q.length + pad * 2);
  return (a ? '… ' : '') + text.slice(a, b) + (b < text.length ? ' …' : '');
}
function runFind() {
  const q = findInput.value.trim().toLowerCase();
  findList.innerHTML = ''; findSel = 0;
  if (!q) { findHits = []; findCount.textContent = ''; return; }
  findHits = FIND_IX
    .filter(r => r.hay.includes(q))
    // 제목·머리글에 있는 쪽을 위로. 같은 점수면 슬라이드 순서대로
    .map(r => ({ r, score: (r.head.toLowerCase().includes(q) ? 0 : 1) }))
    .sort((a, b) => a.score - b.score || a.r.n - b.r.n)
    .map(x => x.r);
  // 숫자만 치면 그 번호의 장을 맨 위에 두고 선택해 둔다 — 점검할 때 가장 많이 쓰는 게 장 이동이다.
  // 「12」「12장」「#12」 모두 받는다. 본문에서 그 숫자를 찾은 결과는 그 아래에 그대로 남긴다.
  // (카테캠 특강 덱에서 만들어 쓰던 것을 2026-10-05 템플릿으로 옮겼다 — 그전 덱에는 없다)
  const pm = q.match(/^#?(\d+)\s*(장|쪽|p)?$/);
  const page = pm ? FIND_IX[parseInt(pm[1], 10) - 1] : null;
  if (page) findHits = [page, ...findHits.filter(r => r !== page)];
  const textHits = findHits.length - (page ? 1 : 0);
  findCount.textContent = page ? (page.n + 1) + '장으로 이동' + (textHits ? ' · 본문 일치 ' + textHits + '장' : '')
                        : findHits.length ? findHits.length + '장' : '없습니다';
  findHits.forEach((r, k) => {
    const li = document.createElement('li');
    li.className = k === 0 ? 'sel' : '';
    if (r === page && k === 0) {
      li.innerHTML = "<span class='fnum'>" + (r.n + 1) + "</span><span class='fmain'>"
        + "<div class='ftitle'>" + esc(r.title) + "</div>"
        + "<div class='fsnip'><mark>" + (r.n + 1) + "장으로 이동</mark> " + esc(snippet(r.head || r.body, '', 46)) + "</div></span>";
      li.addEventListener('click', () => { go(r.n); closeFind(); });
      findList.appendChild(li);
      return;
    }
    const snipSrc = r.head.toLowerCase().includes(q) ? r.head
                  : r.body.toLowerCase().includes(q) ? r.body
                  : (r.head || r.body);          // 제목에만 있는 경우
    li.innerHTML = "<span class='fnum'>" + (r.n + 1) + "</span><span class='fmain'>"
      + "<div class='ftitle'>" + mark(r.title, q) + "</div>"
      + "<div class='fsnip'>" + mark(snippet(snipSrc, q, 46), q) + "</div></span>";
    li.addEventListener('click', () => { go(r.n); closeFind(); });
    findList.appendChild(li);
  });
}
function moveSel(d) {
  if (!findHits.length) return;
  findSel = (findSel + d + findHits.length) % findHits.length;
  [...findList.children].forEach((li, k) => li.classList.toggle('sel', k === findSel));
  const cur = findList.children[findSel];
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function openFind() {
  document.body.classList.add('find-open');
  findInput.value = ''; runFind();
  findInput.focus();
}
function closeFind() { document.body.classList.remove('find-open'); findInput.blur(); }

findInput.addEventListener('input', runFind);
/* 입력란 안의 키는 여기서 처리한다 — 아래 전역 핸들러는 INPUT 에 포커스가 있으면 빠진다 */
findInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (e.isComposing) return;               // 한글 조합 중의 Enter 는 확정이지 이동이 아니다
    if (findHits[findSel]) { go(findHits[findSel].n); closeFind(); }
  }
});
findEl.addEventListener('mousedown', e => { if (e.target === findEl) closeFind(); });

document.addEventListener('keydown', e => {
  // Use e.code (physical key) AND e.key, so shortcuts work even when the IME is in Korean mode
  // (where e.key for the P key becomes a Hangul char / 'Process').
  // ⚠️ 조합키는 브라우저 몫이다. Cmd+F(찾기)·Ctrl+R(새로고침)까지 우리가 삼키면
  //    발표 중 검색이 안 되고 전체화면이 켜져 버린다. Shift 는 통과시킨다.
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // 입력란에 포커스가 있으면 단축키를 잡지 않는다 (글자를 치는 중일 수 있다)
  const _t = e.target;
  if (_t && (_t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(_t.tagName || ''))) return;
  const c = e.code;
  if (e.key === '/' || (c === 'Slash' && !e.shiftKey)) { e.preventDefault(); openFind(); return; }
  if (['ArrowRight',' ','PageDown'].includes(e.key) || c === 'Space' || c === 'PageDown') { e.preventDefault(); go(i + 1); }
  else if (['ArrowLeft','PageUp'].includes(e.key) || c === 'PageUp') { e.preventDefault(); go(i - 1); }
  else if (e.key === 'Home' || c === 'Home') go(0);
  else if (e.key === 'End' || c === 'End') go(SLIDES.length - 1);
  else if (e.key.toLowerCase() === 'p' || c === 'KeyP') togglePresenter();
  /* ★ N = 인라인 노트 드로어 (**항상**). ⇧N = 나레이션 재생/멈춤.
     ⚠️ 예전에는 오디오가 있으면 N 이 나레이션으로 바뀌었다. 그러면 발표자가 가장 자주
        누르는 키의 뜻이 **덱마다 달라진다** — 손이 기억한 걸 배신하는 바로 그 문제다.
        상수는 노트 쪽이므로 N 을 노트에 고정하고, 부가 기능인 나레이션에 Shift 를 준다.
        (2026-08-23 본인 지적으로 뒤집었다.)
     Space 는 "다음 장" 이라 재생에 쓰지 않는다. */
  else if (e.key.toLowerCase() === 'n' || c === 'KeyN') {
    if (HAS_AUDIO && e.shiftKey) toggleNarration(); else toggleNotes();
  }
  else if (e.key.toLowerCase() === 'f' || c === 'KeyF') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
let tx = 0;
stage.addEventListener('touchstart', e => tx = e.changedTouches[0].clientX);
stage.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(dx < 0 ? i + 1 : i - 1); });
const _st = loadState();
i = _st.idx;
if (_st.notes) document.body.classList.add('notes-open');
setNotesH(_st.h, false);
render();
</script>
</body>
