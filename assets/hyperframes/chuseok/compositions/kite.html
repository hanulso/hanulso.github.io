      <script>
        (function () {
          // 각 컴포지션 스크립트 앞에 인라인되는 타임라인 헬퍼. 모든 값은 타임라인 시간만으로 정해진다.

  const n = Math.max(1, Math.round(dur * 10));

}

  const n = Math.max(1, Math.floor(dur / period));
  const a = (v) => (0.05 + 0.55 * v) * R2D;
  ['wl', 'wr'].forEach((w) =>
    tl.fromTo(q(p + '-' + w), { rotation: a(lo), svgOrigin: '0 0', smoothOrigin: false },
      { rotation: a(hi), svgOrigin: '0 0', smoothOrigin: false, duration: period / 2, ease: 'sine.inOut', yoyo: true, repeat: n * 2 - 1, immediateRender: t0 === 0 }, t0));

  ['fl', 'fr', 'bl', 'br'].forEach((k, i) => {
    if (vals[i] === null || vals[i] === undefined) return;
    tl.to(q(p + '-' + k), { rotation: legDeg(k, vals[i]), svgOrigin: '0 0', smoothOrigin: false, duration: dur, ease }, t);

function legSet(tl, p, t, vals) { legs(tl, p, t, vals, 0.001, 'none'); }

  tl.fromTo(q(p + '-' + leg), { rotation: legDeg(leg, base - amp), svgOrigin: '0 0', smoothOrigin: false },
    { rotation: legDeg(leg, base + amp), svgOrigin: '0 0', smoothOrigin: false, duration: period / 2, ease: 'sine.inOut', yoyo: true, repeat: n * 2 - 1, immediateRender: false }, t0);

  if ('sweat' in extra) tl.set(q(p + '-sweat'), { opacity: extra.sweat ? 1 : 0 }, t);

  const n = Math.max(1, Math.floor(dur / period));
